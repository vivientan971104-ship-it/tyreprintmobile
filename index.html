<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TyrePrint — Racing Z</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap');

:root {
  --bg:#f0ede8;--surface:#faf8f5;--dark:#0f0e0c;
  --mid:#3a3830;--muted:#8a8580;--border:#d8d4ce;--radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--dark);min-height:100vh;padding-bottom:40px;}

.topnav{background:#111;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;}
.topnav-logo{height:36px;width:auto;filter:invert(1);}
.topnav-info{display:flex;flex-direction:column;}
.topnav-name{font-family:'Syne',sans-serif;font-size:13px;font-weight:800;color:white;}
.topnav-sub{font-size:9px;color:#888;letter-spacing:1.5px;text-transform:uppercase;}

.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:60px;z-index:99;}
.tab{flex:1;padding:11px 4px;text-align:center;font-size:11px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;cursor:pointer;transition:all 0.15s;user-select:none;}
.tab.active{color:#111;border-bottom-color:#111;}

.page{display:none;padding:16px;}
.page.active{display:block;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.card-title{font-family:'DM Mono',monospace;font-size:9px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:#555;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.card-title::after{content:'';flex:1;height:1px;background:var(--border);}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;}
.field:last-child{margin-bottom:0;}
.field label{font-size:11px;font-weight:600;color:var(--mid);}
.field input,.field textarea{font-family:'DM Sans',sans-serif;font-size:15px;background:var(--bg);border:1.5px solid var(--border);color:var(--dark);padding:11px 13px;border-radius:8px;outline:none;width:100%;-webkit-appearance:none;}
.field input:focus,.field textarea:focus{border-color:#111;box-shadow:0 0 0 3px rgba(0,0,0,0.08);}
.field textarea{resize:vertical;min-height:70px;font-size:14px;line-height:1.5;}
.field input[type=date]{font-size:14px;}

.tyre-add-row{display:grid;grid-template-columns:1fr 80px;gap:8px;margin-bottom:10px;}
.tyre-add-row input{font-family:'DM Mono',monospace;font-size:14px;}

.btn-add{width:100%;background:#111;color:white;border:none;font-family:'Syne',sans-serif;font-size:14px;font-weight:700;padding:12px;border-radius:8px;cursor:pointer;transition:all 0.15s;margin-bottom:10px;}
.btn-add:active{opacity:0.8;transform:scale(0.98);}

.tyre-list{display:flex;flex-direction:column;gap:8px;}
.tyre-chip{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:10px 13px;animation:pop 0.18s ease;}
@keyframes pop{from{opacity:0;transform:scale(0.95);}to{opacity:1;transform:scale(1);}}
.tyre-chip-left{display:flex;align-items:center;gap:10px;}
.tyre-chip-size{font-family:'DM Mono',monospace;font-size:14px;font-weight:500;}
.tyre-chip-qty{background:#111;color:white;font-family:'DM Mono',monospace;font-size:11px;padding:2px 9px;border-radius:20px;}
.tyre-chip-del{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px;}

.slider-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.slider-field{display:flex;flex-direction:column;gap:4px;}
.slider-field label{font-size:10px;font-weight:600;color:var(--mid);display:flex;justify-content:space-between;}
.slider-field label span{font-family:'DM Mono',monospace;color:#111;font-weight:700;}
.slider-field input[type=range]{width:100%;accent-color:#111;}

.btn-generate{width:100%;background:#111;color:white;border:none;font-family:'Syne',sans-serif;font-size:16px;font-weight:800;padding:16px;border-radius:var(--radius);cursor:pointer;margin-top:4px;transition:all 0.15s;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-generate:active{opacity:0.85;transform:scale(0.98);}

.preview-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.preview-toolbar h2{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;}
.btn-print{background:#111;color:white;border:none;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;padding:10px 18px;border-radius:8px;cursor:pointer;}

.page-divider{text-align:center;font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:2px;padding:10px 0;margin:12px 0;border-top:1px dashed var(--border);}
.page-divider:first-child{margin-top:0;border-top:none;}

.empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
.empty-icon{font-size:40px;margin-bottom:12px;opacity:0.4;}
.empty-state h3{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:var(--mid);opacity:0.5;margin-bottom:6px;}
.empty-state p{font-size:13px;line-height:1.6;}

/* ── A6 LABEL ── */
.label-wrap{overflow-x:auto;padding-bottom:8px;}
.a6-label{width:340px;background:white;border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,0.15);overflow:hidden;display:flex;flex-direction:column;margin:0 auto;color:#000;}
.lbl-topbar{height:5px;background:#000;}

.lbl-header{padding:10px 12px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #000;}
.lbl-logo-area{display:flex;align-items:center;gap:8px;}
.lbl-logo-img{height:40px;width:auto;}
.lbl-co-block{display:flex;flex-direction:column;border-left:2px solid #000;padding-left:8px;}
.lbl-co-name{font-family:'Syne',sans-serif;font-weight:800;color:#000;text-transform:uppercase;line-height:1.2;}
.lbl-co-sub{font-family:'DM Mono',monospace;font-size:7px;color:#444;letter-spacing:0.5px;margin-top:1px;}
.lbl-title-block{text-align:right;}
.lbl-title-big{font-family:'Syne',sans-serif;font-weight:800;color:#000;letter-spacing:1px;text-transform:uppercase;line-height:1;}
.lbl-title-small{font-size:7px;color:#555;letter-spacing:1.5px;text-transform:uppercase;}

/* DATE ROW */
.lbl-date-row{display:flex;align-items:center;justify-content:space-between;padding:5px 12px;border-bottom:1px solid #000;background:#e8e8e8;}
.lbl-date-label{font-family:'DM Mono',monospace;font-size:7px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:#333;}
.lbl-date-val{font-family:'DM Mono',monospace;font-weight:700;color:#000;}
.lbl-page-badge{font-family:'DM Mono',monospace;font-size:8px;font-weight:700;color:#000;background:#ddd;padding:1px 7px;border-radius:2px;letter-spacing:1px;}

.lbl-dealer{padding:7px 12px;border-bottom:1px solid #000;background:#f0f0f0;}
.lbl-sec-lbl{font-family:'DM Mono',monospace;font-size:7px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:#333;margin-bottom:3px;}
.lbl-dealer-name{font-family:'Syne',sans-serif;font-weight:700;color:#000;margin-bottom:2px;}
.lbl-dealer-addr{color:#333;line-height:1.5;margin-bottom:2px;}
.lbl-dealer-tel{font-family:'DM Mono',monospace;color:#333;}

.lbl-tyre-wrap{padding:8px 12px;flex:1;}
.lbl-table{width:100%;border-collapse:collapse;border:1.5px solid #000;}
.lbl-table thead tr{background:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
.lbl-table thead th{font-family:'DM Mono',monospace;font-size:7.5px;font-weight:500;letter-spacing:1px;text-transform:uppercase;color:#fff;padding:5px 7px;text-align:left;}
.lbl-table thead th:last-child{text-align:center;}
.lbl-table tbody tr{border-bottom:1px solid #bbb;}
.lbl-table tbody tr:last-child{border-bottom:none;}
.lbl-table td{padding:6px 7px;vertical-align:middle;border-right:1px solid #ddd;}
.lbl-table td:last-child{border-right:none;}
.lbl-size{font-family:'DM Mono',monospace;font-weight:500;color:#000;white-space:nowrap;}
.lbl-ticks{display:flex;flex-wrap:wrap;gap:3px;}
.lbl-tick{width:14px;height:14px;border:1.5px solid #000;border-radius:1px;display:inline-flex;background:white;flex-shrink:0;}
.lbl-qty{text-align:center;font-family:'DM Mono',monospace;font-weight:700;color:#000;}
.lbl-total-row td{padding:6px 7px 4px;border-top:2px solid #000;}
.lbl-total-label{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:2px;text-transform:uppercase;color:#000;font-weight:700;}
.lbl-total-val{font-family:'Syne',sans-serif;font-weight:800;color:#000;text-align:right;}
.lbl-bottombar{height:4px;background:#000;}

/* ── PRINT ── */
@media print {
  @page{size:A6 portrait;margin:0;}
  body{background:white!important;padding:0!important;}
  .topnav,.tabs,#formPage,#fontPage,.preview-toolbar,.page-divider{display:none!important;}
  #previewPage{display:block!important;padding:0!important;}
  .label-wrap{overflow:visible!important;}
  .print-page{page-break-after:always;break-after:page;}
  .print-page:last-child{page-break-after:avoid;break-after:avoid;}
  .a6-label{width:105mm!important;min-height:148mm!important;box-shadow:none!important;border-radius:0!important;margin:0!important;}
  .btn-print{display:none!important;}
  .lbl-table thead tr,.lbl-topbar,.lbl-bottombar,.lbl-dealer,.lbl-date-row{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
}
</style>
</head>
<body>

<div class="topnav">
  <img class="topnav-logo" id="navLogo" alt="Racing Z">
  <div class="topnav-info">
    <span class="topnav-name">Racing Z Trading Sdn Bhd</span>
    <span class="topnav-sub">Tyre Label System</span>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('form')">📋 填写资料</div>
  <div class="tab" onclick="switchTab('font')">🔤 字体</div>
  <div class="tab" onclick="switchTab('preview')">🏷️ 预览打印</div>
</div>

<!-- FORM -->
<div class="page active" id="formPage">
  <div class="card">
    <div class="card-title">日期 & Dealer 资料</div>
    <div class="field">
      <label>日期 Date</label>
      <input type="date" id="orderDate">
    </div>
    <div class="field">
      <label>Dealer 公司名称</label>
      <input type="text" id="dealerName" placeholder="Dealer Sdn Bhd">
    </div>
    <div class="field">
      <label>地址</label>
      <textarea id="dealerAddr" placeholder="No. 12, Jalan Maju,&#10;47500 Subang Jaya"></textarea>
    </div>
    <div class="field">
      <label>电话号码</label>
      <input type="tel" id="dealerTel" placeholder="+60 12-345 6789">
    </div>
  </div>

  <div class="card">
    <div class="card-title">轮胎尺寸 & 数量</div>
    <div class="tyre-add-row">
      <div class="field" style="margin:0">
        <label>尺寸</label>
        <input type="text" id="newSize" placeholder="205/55R16" style="font-family:'DM Mono',monospace">
      </div>
      <div class="field" style="margin:0">
        <label>数量 (pcs)</label>
        <input type="number" id="newQty" placeholder="10" min="1" max="99" style="font-family:'DM Mono',monospace">
      </div>
    </div>
    <button class="btn-add" onclick="addTyre()">＋ 加入轮胎</button>
    <div class="tyre-list" id="tyreList"></div>
  </div>

  <button class="btn-generate" onclick="generateAndSwitch()">⚡ 生成标签</button>
</div>

<!-- FONT -->
<div class="page" id="fontPage">
  <div class="card">
    <div class="card-title">公司 & 标题</div>
    <div class="slider-grid">
      <div class="slider-field">
        <label>公司名称 <span id="v_coName">13</span>px</label>
        <input type="range" min="8" max="22" value="13" oninput="updateFont('coName',this.value)">
      </div>
      <div class="slider-field">
        <label>TYRE ORDER <span id="v_title">15</span>px</label>
        <input type="range" min="10" max="26" value="15" oninput="updateFont('title',this.value)">
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Dealer 资料</div>
    <div class="slider-grid">
      <div class="slider-field">
        <label>Dealer 名称 <span id="v_dealerName">14</span>px</label>
        <input type="range" min="8" max="22" value="14" oninput="updateFont('dealerName',this.value)">
      </div>
      <div class="slider-field">
        <label>地址 <span id="v_dealerAddr">9</span>px</label>
        <input type="range" min="6" max="16" value="9" oninput="updateFont('dealerAddr',this.value)">
      </div>
      <div class="slider-field">
        <label>电话 <span id="v_dealerTel">9</span>px</label>
        <input type="range" min="6" max="16" value="9" oninput="updateFont('dealerTel',this.value)">
      </div>
      <div class="slider-field">
        <label>日期 <span id="v_date">10</span>px</label>
        <input type="range" min="7" max="18" value="10" oninput="updateFont('date',this.value)">
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">轮胎表格</div>
    <div class="slider-grid">
      <div class="slider-field">
        <label>轮胎尺寸 <span id="v_tyreSize">13</span>px</label>
        <input type="range" min="8" max="22" value="13" oninput="updateFont('tyreSize',this.value)">
      </div>
      <div class="slider-field">
        <label>数量 PCS <span id="v_tyreQty">14</span>px</label>
        <input type="range" min="8" max="22" value="14" oninput="updateFont('tyreQty',this.value)">
      </div>
      <div class="slider-field">
        <label>总数 Total <span id="v_total">20</span>px</label>
        <input type="range" min="10" max="30" value="20" oninput="updateFont('total',this.value)">
      </div>
    </div>
  </div>
  <button class="btn-generate" onclick="generateAndSwitch()">⚡ 生成标签预览</button>
</div>

<!-- PREVIEW -->
<div class="page" id="previewPage">
  <div class="preview-toolbar">
    <h2>标签预览</h2>
    <button class="btn-print" onclick="window.print()">🖨 打印 A6</button>
  </div>
  <div id="labelOutput">
    <div class="empty-state">
      <div class="empty-icon">🏷️</div>
      <h3>还没有标签</h3>
      <p>填好资料后点「生成标签」</p>
    </div>
  </div>
</div>

document.getElementById('navLogo').src = LOGO;

// Set today's date as default
const today = new Date().toISOString().split('T')[0];
document.getElementById('orderDate').value = today;

let tyres = [];
let fonts = { coName:13, title:15, dealerName:14, dealerAddr:9, dealerTel:9, date:10, tyreSize:13, tyreQty:14, total:20 };

function switchTab(tab) {
  ['form','font','preview'].forEach((t,i) => {
    document.querySelectorAll('.tab')[i].classList.toggle('active', t===tab);
    document.getElementById(t+'Page').classList.toggle('active', t===tab);
  });
  if(tab==='preview') window.scrollTo(0,0);
}

function updateFont(key, val) {
  fonts[key] = parseInt(val);
  document.getElementById('v_'+key).textContent = val;
}

function addTyre() {
  const size = document.getElementById('newSize').value.trim().toUpperCase();
  const qty  = parseInt(document.getElementById('newQty').value)||0;
  if(!size){document.getElementById('newSize').focus();return;}
  if(qty<1){document.getElementById('newQty').focus();return;}
  tyres.push({size,qty});
  document.getElementById('newSize').value='';
  document.getElementById('newQty').value='';
  document.getElementById('newSize').focus();
  renderList();
}

document.getElementById('newSize').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('newQty').focus();});
document.getElementById('newQty').addEventListener('keydown',e=>{if(e.key==='Enter')addTyre();});

function removeTyre(i){tyres.splice(i,1);renderList();}

function renderList(){
  document.getElementById('tyreList').innerHTML = tyres.map((t,i)=>
    '<div class="tyre-chip"><div class="tyre-chip-left"><span class="tyre-chip-size">'+t.size+'</span><span class="tyre-chip-qty">'+t.qty+' pcs</span></div><button class="tyre-chip-del" onclick="removeTyre('+i+')">×</button></div>'
  ).join('');
}

function formatDate(val) {
  if(!val) return '—';
  const [y,m,d] = val.split('-');
  return d+'/'+m+'/'+y;
}

function generateAndSwitch(){generateLabel();switchTab('preview');}

function generateLabel(){
  const dateVal    = document.getElementById('orderDate').value;
  const dealerName = document.getElementById('dealerName').value.trim();
  const dealerAddr = document.getElementById('dealerAddr').value.trim();
  const dealerTel  = document.getElementById('dealerTel').value.trim();
  const output     = document.getElementById('labelOutput');

  if(!dealerName && tyres.length===0){
    output.innerHTML='<div class="empty-state"><div class="empty-icon">⚠️</div><h3>请先填写资料</h3><p>填好 Dealer 资料和轮胎尺寸再生成</p></div>';
    return;
  }

  const TYRES_PER_PAGE = 4;
  const totalTyres = tyres.length || 1;
  const totalPages = Math.ceil(totalTyres / TYRES_PER_PAGE);
  const grandTotal = tyres.reduce((s,t)=>s+t.qty,0);
  const dateStr    = formatDate(dateVal);

  let html = '';

  for(let p=0; p<totalPages; p++){
    const pageTyres = tyres.slice(p*TYRES_PER_PAGE, (p+1)*TYRES_PER_PAGE);
    const pageTotal = pageTyres.reduce((s,t)=>s+t.qty,0);
    const badge     = (p+1)+'/'+totalPages;
    const isLast    = p === totalPages-1;

    const tyreRows = pageTyres.map(t=>{
      const boxes = Array.from({length:Math.min(t.qty,25)},()=>'<div class="lbl-tick"></div>').join('');
      return '<tr>'
        +'<td class="lbl-size" style="font-size:'+fonts.tyreSize+'px">'+t.size+'</td>'
        +'<td><div class="lbl-ticks">'+boxes+'</div></td>'
        +'<td class="lbl-qty" style="font-size:'+fonts.tyreQty+'px">'+t.qty+'</td>'
        +'</tr>';
    }).join('');

    const totalLabel = isLast ? 'Grand Total' : 'Page Total';
    const totalShow  = isLast ? grandTotal : pageTotal;

    if(p>0) html += '<div class="page-divider">— PAGE '+badge+' —</div>';

    html +=
      '<div class="print-page">'
      +'<div class="label-wrap"><div class="a6-label">'
      +'<div class="lbl-topbar"></div>'

      // HEADER
      +'<div class="lbl-header">'
        +'<div class="lbl-logo-area">'
          +'<img class="lbl-logo-img" src="'+LOGO+'" alt="Racing Z">'
          +'<div class="lbl-co-block">'
            +'<span class="lbl-co-name" style="font-size:'+fonts.coName+'px">Racing Z Trading</span>'
            +'<span class="lbl-co-name" style="font-size:'+(fonts.coName-1)+'px">Sdn Bhd</span>'
            +'<span class="lbl-co-sub">Tyre Specialist</span>'
          +'</div>'
        +'</div>'
        +'<div class="lbl-title-block">'
          +'<div class="lbl-title-big" style="font-size:'+fonts.title+'px">TYRE ORDER</div>'
          +'<div class="lbl-title-small">Dealer Delivery Form</div>'
        +'</div>'
      +'</div>'

      // DATE + PAGE
      +'<div class="lbl-date-row">'
        +'<div>'
          +'<span class="lbl-date-label">Date: </span>'
          +'<span class="lbl-date-val" style="font-size:'+fonts.date+'px">'+dateStr+'</span>'
        +'</div>'
        +'<span class="lbl-page-badge">'+badge+'</span>'
      +'</div>'

      // DEALER
      +'<div class="lbl-dealer">'
        +'<div class="lbl-sec-lbl">Dealer Detail</div>'
        +'<div class="lbl-dealer-name" style="font-size:'+fonts.dealerName+'px">'+(dealerName||'—')+'</div>'
        +(dealerAddr?'<div class="lbl-dealer-addr" style="font-size:'+fonts.dealerAddr+'px">'+dealerAddr.replace(/\n/g,'<br>')+'</div>':'')
        +(dealerTel?'<div class="lbl-dealer-tel" style="font-size:'+fonts.dealerTel+'px">Tel: '+dealerTel+'</div>':'')
      +'</div>'

      // TYRE TABLE
      +'<div class="lbl-tyre-wrap">'
        +'<div class="lbl-sec-lbl" style="margin-bottom:5px">Tyre Size & Quantity</div>'
        +'<table class="lbl-table">'
          +'<thead><tr>'
            +'<th style="width:34%">Tyre Size</th>'
            +'<th>QTY (Tick)</th>'
            +'<th style="width:14%;text-align:center">PCS</th>'
          +'</tr></thead>'
          +'<tbody>'+tyreRows+'</tbody>'
          +'<tfoot><tr class="lbl-total-row">'
            +'<td class="lbl-total-label">'+totalLabel+'</td><td></td>'
            +'<td class="lbl-total-val" style="font-size:'+fonts.total+'px">'+totalShow+'</td>'
          +'</tr></tfoot>'
        +'</table>'
      +'</div>'

      +'<div class="lbl-bottombar"></div>'
      +'</div></div>'
      +'</div>';
  }

  output.innerHTML = html;
}
</script>
</body>
</html>
